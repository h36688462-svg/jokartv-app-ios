name: jokartv
description: "Jokar TV - Ultimate Entertainment Content, Live TV, Movies, and Series"
publish_to: 'none'

version: 1.0.0+17

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  video_player: ^2.8.6
  chewie: ^1.8.1
  url_launcher: ^6.2.5
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_windows_video: ^1.0.11
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  provider: ^6.1.2
  google_fonts: ^6.2.1
  wakelock_plus: ^1.2.5
  intl: ^0.19.0
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "smartiptv_source/app/src/main/res/drawable/app_logo.png"
  ios: true
  android: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - smartiptv_source/app/src/main/res/drawable/app_logo.png
